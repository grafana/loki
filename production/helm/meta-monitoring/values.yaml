---
# This values file targets the k8s-monitoring Helm chart version 4.x, and is documented at:
# https://grafana.com/docs/loki/latest/operations/meta-monitoring/deploy/
# If you need to install an older, still-supported 3.8.x release of the chart, use
# values-chart-v3.yaml instead.

# Sets the global scrape interval for Alloy components
global:
  scrapeInterval: 15s

# Global Label to be added to all telemetry data. Should reflect a recognizable name for the cluster.
cluster:
  name: loki-meta-monitoring-cluster

# Destinations for telemetry data (metrics, logs)
# The credentials are stored in the secrets metrics and logs
# Further authentication methods are supported, see the documentation (https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/docs/examples/auth)
destinations:
  prometheus:
    type: prometheus
    url: https://<PROMETHEUS-ENDPOINT>/api/prom/push
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: metrics
      namespace: meta

  loki:
    type: loki
    url: https://<LOKI-ENDPOINT>/loki/api/v1/push
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: logs
      namespace: meta

# Components to be monitored by the meta-monitoring Helm chart.
# Two integrations are being used:
# - alloy: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/charts/feature-integrations/docs/integrations/alloy.md
# - loki: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/charts/feature-integrations/docs/integrations/loki.md
integrations:
  collector: alloy-singleton
  alloy:
    instances:
      # monitor the collectors gathering and sending metrics/logs to the local cluster
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: [alloy-singleton]
        namespaces:
          - meta

  loki:
    instances:
      - name: loki
        namespaces:
          - loki
        labelSelectors:
          app.kubernetes.io/name: loki
        logs:
          tuning:
            # extract logfmt fields and set them as structured metadata
            structuredMetadata:
              caller:
              tenant:
              org_id:
              user:

# (Optional) Kubernetes events are captured as logs and are annotated with additional metadata to make them easier to search and filter.
clusterEvents:
  enabled: true
  collector: alloy-singleton
  namespaces:
    - meta
    - loki

# A collection of metric collectors that gather metrics from various sources in the cluster.
# (Required) cadvisor - Used to collect Loki pod metrics. Cadvisor is automatically deployed.
# kubelet - Kubernetes information on each node
# kubeletResource - Scrape resource metrics from the Kubelet.
# kube-state-metrics - A simple service that listens to the Kubernetes API server and generates metrics about the state of the objects.
clusterMetrics:
  enabled: true
  collector: alloy-singleton
  kubelet:
    enabled: true
  kubeletResource:
    enabled: true
  cadvisor:
    enabled: true
    metricsTuning:
      includeNamespaces:
        - loki
        - meta
  apiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeDNS:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  kube-state-metrics:
    enabled: true
    metricsTuning:
      useDefaultAllowList: false
      includeMetrics: [(.+)]

# node-exporter, windows-exporter, and kepler moved out of clusterMetrics in chart 4.x. Node metrics
# are now configured under hostMetrics.linuxHosts; kepler and opencost are unused here and left
# disabled by omission.
hostMetrics:
  enabled: true
  collector: alloy-singleton
  linuxHosts:
    enabled: true
    metricsTuning:
      useIntegrationAllowList: true

# Deploys the telemetry services this file relies on: kube-state-metrics (for clusterMetrics above)
# and node-exporter (for hostMetrics.linuxHosts above).
telemetryServices:
  kube-state-metrics:
    deploy: true
    # In chart 4.x, kube-state-metrics is a dependency of the telemetry-services subchart, so this is
    # where its namespace scope must be set. Setting clusterMetrics.kube-state-metrics.namespaces has
    # no effect on 4.x, and kube-state-metrics would watch every namespace.
    namespaces: loki,meta
  node-exporter:
    deploy: true

nodeLogs:
  enabled: false

# Enable pod log collection for the cluster. Will collect logs from all pods in both the meta and loki namespace.
#
# chart 4.x replaced the single `podLogs` feature (and its `labelsToKeep` filter) with
# `podLogsViaKubernetesApi`, `podLogsViaLoki`, and `podLogsViaOpenTelemetry`. This file keeps the
# `kubernetesApi` gather method used previously.
#
# `namespace`, `pod`, `container`, and `job` are always attached as labels by this feature and do not
# need to be listed here. `level`, `service_name`, and `cluster` come from log line processing and the
# global cluster label, not from this section. `app` and `component` are copied here explicitly
# because, unlike the labels above, they come from Kubernetes Pod labels rather than from Alloy's own
# discovery metadata. Review this mapping if you rely on other Kubernetes Pod labels being present as
# Loki labels.
podLogsViaKubernetesApi:
  enabled: true
  collector: alloy-singleton
  namespaces:
    - meta
    - loki
  labels:
    app: app
    app_kubernetes_io_name: app.kubernetes.io/name
    component: app.kubernetes.io/component
  structuredMetadata:
    # A null value here is skipped by the chart, so the label name must be repeated explicitly.
    pod: pod

# Collectors
# The Alloy Singleton is a single instance of the Alloy Collector that is deployed in the cluster.
collectors:
  alloy-singleton:
    presets: [singleton]
