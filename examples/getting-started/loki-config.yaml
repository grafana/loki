---
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

memberlist:
  join_members: ["read", "write", "backend"]
  dead_node_reclaim_time: 30s
  gossip_to_dead_nodes_time: 15s
  left_ingesters_timeout: 30s
  bind_addr: ['0.0.0.0']
  bind_port: 7946
  gossip_interval: 2s

schema_config:
  configs:
    - from: 2023-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  use_thanos_objstore: true

common:
  path_prefix: /loki
  replication_factor: 1
  compactor_address: http://backend:3100
  storage:
    object_store:
      s3:
        endpoint: silo:9000
        insecure: true
        bucket_name: loki-data
        access_key_id: loki
        secret_access_key: supersecret
        bucket_lookup_type: path
  ring:
    kvstore:
      store: memberlist
ruler_storage:
  backend: s3
  s3:
    endpoint: silo:9000
    insecure: true
    bucket_name: loki-ruler
    access_key_id: loki
    secret_access_key: supersecret
    bucket_lookup_type: path

compactor:
  working_directory: /tmp/compactor