syntax = "proto3";

package proto;

service IngestLimitsFrontend {
  rpc ExceedsLimits(ExceedsLimitsRequest) returns (ExceedsLimitsResponse) {}
  rpc CheckLimitsAndShard(CheckLimitsAndShardRequest) returns (CheckLimitsAndShardResponse) {}
}

service IngestLimits {
  rpc ExceedsLimits(ExceedsLimitsRequest) returns (ExceedsLimitsResponse) {}
  rpc GetAssignedPartitions(GetAssignedPartitionsRequest) returns (GetAssignedPartitionsResponse) {}
  rpc CheckLimitsAndShard(CheckLimitsAndShardRequest) returns (CheckLimitsAndShardResponse) {}
}

message ExceedsLimitsRequest {
  string tenant = 1;
  repeated StreamMetadata streams = 2;
}

message ExceedsLimitsResponse {
  repeated ExceedsLimitsResult results = 1;
}

message ExceedsLimitsResult {
  uint64 streamHash = 1;
  uint32 reason = 2;
}

message GetAssignedPartitionsRequest {}

message GetAssignedPartitionsResponse {
  map<int32, int64> assignedPartitions = 1;
}

message StreamMetadata {
  uint64 streamHash = 1;
  uint64 totalSize = 2;
  // The resolved ingestion policy for this stream if any. May be used to override some ingestion limits for this stream such as the max streams allowed.
  string ingestionPolicy = 3;
}

// ShardRateBucket is the absolute total a single zone observed for a single
// stream in a single rate bucket. It is not a delta: consumers merge it by
// assignment, keyed by (stream, zone, bucketStart), so applying a record
// more than once is a no-op and replay cannot double-count.
message ShardRateBucket {
  // Start of the bucket in unix nanoseconds, truncated to the bucket size.
  int64 bucketStart = 1;
  uint64 size = 2;
  uint64 pushes = 3;
}

message StreamMetadataRecord {
  string zone = 1;
  string tenant = 2;
  StreamMetadata metadata = 3;
  // The rate bucket the producing zone was in when it wrote this record.
  // Optional: only set by the stream sharding path, and only when stream
  // sharding durability is enabled.
  ShardRateBucket shardRateBucket = 4;
  // The shard count the producing zone last granted this stream. Restores
  // the stream count budget on replay.
  uint32 shardCount = 5;
}

message CheckLimitsAndShardRequest {
  string tenant = 1;
  repeated StreamMetadata streams = 2;
}

message CheckLimitsAndShardResponse {
  repeated StreamShardResult results = 1;
}

message StreamShardResult {
  uint64 streamHash = 1;
  // The total number of physical streams the distributor should write for
  // this logical stream on this push, matching the semantics of the
  // distributor's own rate-store shard count, so 1 means no sharding is
  // needed. At least 1 when the stream was accepted. 0 is valid only
  // together with rejectReason, as a rejected stream is not written at all;
  // a result with neither carries no decision and the frontend replaces it
  // with one shard.
  uint32 shards = 2;
  // Non-empty when the stream was rejected (only possible for a
  // brand-new stream with no room left in the tenant's stream-count
  // budget).
  // Empty means the stream was accepted, regardless of shards.
  string rejectReason = 3;
  // Stats around the sharding decision
  ShardStats stats = 4;
}

message ShardStats {
  // Reason enum, see reason.go. Populated when shards was capped below the
  // rate-justified ideal (ShardsCapped), when the decision could not be made
  // (Failed), or when the receiving instance did not own the stream's
  // partition (NotOwned).
  uint32 shardDecisionContext = 1;
  // The byte/s rate the backend evaluated for this stream when deciding the
  // shard count.
  uint64 evaluatedRate = 2;
}
