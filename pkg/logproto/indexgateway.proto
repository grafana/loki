syntax = "proto3";

package indexgatewaypb;

import "gogoproto/gogo.proto";
import "pkg/logproto/logproto.proto";
import "pkg/logqlmodel/stats/stats.proto";

option go_package = "github.com/grafana/loki/v3/pkg/logproto";

// This exists in a different file to retain proto namespacing compatibility with it's prior definition, but has been relocated to the logproto go pkg.
service IndexGateway {
  /// GetChunkRef returns chunk reference that match the provided label matchers
  rpc GetChunkRef(logproto.GetChunkRefRequest) returns (logproto.GetChunkRefResponse) {}

  rpc GetSeries(logproto.GetSeriesRequest) returns (logproto.GetSeriesResponse) {}

  rpc LabelNamesForMetricName(logproto.LabelNamesForMetricNameRequest) returns (logproto.LabelResponse) {}

  rpc LabelValuesForMetricName(logproto.LabelValuesForMetricNameRequest) returns (logproto.LabelResponse) {}

  // Note: this MUST be the same as the variant defined in
  // logproto.proto on the Querier service.
  rpc GetStats(logproto.IndexStatsRequest) returns (logproto.IndexStatsResponse) {}

  // Note: this MUST be the same as the variant defined in
  // logproto.proto on the Querier service.
  rpc GetVolume(logproto.VolumeRequest) returns (logproto.VolumeResponse) {}

  // GetShards is an optimized implemented shard-planning implementation
  // on the index gateway and not on the ingester.
  rpc GetShards(ShardsRequest) returns (stream ShardsResponse);

  // ResolveDataObjectSections resolves the data-object sections, and their matching
  // source-object stream IDs, for a single 12h UTC-aligned window and set of matchers.
  // It is specific to data objects (distinct from the chunk-index RPCs above).
  rpc ResolveDataObjectSections(ResolveDataObjectSectionsRequest) returns (ResolveDataObjectSectionsResponse) {}
}

message ShardsRequest {
  int64 from = 1 [
    (gogoproto.customtype) = "github.com/prometheus/common/model.Time",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "from"
  ];
  int64 through = 2 [
    (gogoproto.customtype) = "github.com/prometheus/common/model.Time",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "through"
  ];
  string query = 3 [(gogoproto.jsontag) = "query"];
  uint64 targetBytesPerShard = 4 [(gogoproto.jsontag) = "targetBytesPerShard"];
}

message ShardsResponse {
  repeated Shard shards = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "shards"
  ];
  stats.Result statistics = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "statistics"
  ];
  // If present, includes the chunk refs for each shard,
  // therefore the length will be equal to the length of the `shards` field.
  repeated logproto.ChunkRefGroup chunkGroups = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "chunkGroups"
  ];
}

message Shard {
  FPBounds bounds = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "bounds"
  ];
  logproto.IndexStatsResponse stats = 2 [(gogoproto.jsontag) = "stats"];
}

// FPBounds is identical to the definition in `pkg/storage/bloom/v1/bounds.FingerprintBounds`
// which ensures we can cast between them without allocations.
message FPBounds {
  uint64 min = 1 [
    (gogoproto.casttype) = "github.com/prometheus/common/model.Fingerprint",
    (gogoproto.jsontag) = "min"
  ];
  uint64 max = 2 [
    (gogoproto.casttype) = "github.com/prometheus/common/model.Fingerprint",
    (gogoproto.jsontag) = "max"
  ];
}

// ResolveDataObjectSectionsRequest asks the index-gateway to resolve the data-object sections
// matching `matchers` within a single 12h UTC-aligned window [from, through). The window must be
// aligned: `from` truncated to 12h UTC and `through == from + 12h`; otherwise the RPC fails.
message ResolveDataObjectSectionsRequest {
  int64 from = 1 [
    (gogoproto.customtype) = "github.com/prometheus/common/model.Time",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "from"
  ];
  int64 through = 2 [
    (gogoproto.customtype) = "github.com/prometheus/common/model.Time",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "through"
  ];
  string matchers = 3 [(gogoproto.jsontag) = "matchers"];
}

message ResolveDataObjectSectionsResponse {
  repeated ResolvedDataObject objects = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "objects"
  ];
}

// ResolvedDataObject is one data object and the matching sections within it.
message ResolvedDataObject {
  string objectPath = 1 [(gogoproto.jsontag) = "objectPath"];
  repeated ResolvedDataObjectSection sections = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "sections"
  ];
}

// ResolvedDataObjectSection is one section and the source-object stream IDs matching the query.
message ResolvedDataObjectSection {
  int64 sectionIdx = 1 [(gogoproto.jsontag) = "sectionIdx"];
  repeated int64 streamIds = 2 [(gogoproto.jsontag) = "streamIds"];
}

// CachedDataObjectSections is the value stored in the resolution cache. It carries the inputs that
// produced the response (the matchers and the resolved index-object set) so that a hash-key
// collision is detected on read — a mismatch is treated as a cache miss rather than a wrong answer.
message CachedDataObjectSections {
  string matchers = 1 [(gogoproto.jsontag) = "matchers"];
  repeated CachedDataObjectIndexEntry indexes = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "indexes"
  ];
  repeated ResolvedDataObject objects = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "objects"
  ];
  // window_from_nanos is the resolution window start. Section resolution is window-dependent, but the
  // listed index-object set can be identical for two adjacent windows that share a straddling object,
  // so the window must be part of the cached entry's identity to prevent a cross-window false hit.
  int64 window_from_nanos = 4 [(gogoproto.jsontag) = "window_from_nanos"];
}

// CachedDataObjectIndexEntry is one index object identity (path + covered time range) as stored in the cache.
message CachedDataObjectIndexEntry {
  string path = 1 [(gogoproto.jsontag) = "path"];
  int64 startNanos = 2 [(gogoproto.jsontag) = "startNanos"];
  int64 endNanos = 3 [(gogoproto.jsontag) = "endNanos"];
}
