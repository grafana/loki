// physicalpb.proto holds types for the physical plan of a compaction task.
syntax = "proto3";

package loki.physical;

import "gogoproto/gogo.proto";
import "pkg/dataobj/compaction/v2/proto/compactionv2.proto";
import "pkg/engine/internal/proto/ulid/ulid.proto";

option go_package = "github.com/grafana/loki/v3/pkg/engine/internal/proto/physicalpb";

// Plan represents a physical plan.
message Plan {
  repeated Node nodes = 1;
  repeated PlanEdge edges = 2;
}

// PlanEdge represents a relationship between two nodes in the physical plan.
message PlanEdge {
  NodeID parent = 1 [(gogoproto.nullable) = false];
  NodeID child = 2 [(gogoproto.nullable) = false];
}

// NodeID represents a unique identifier for a node in the physical plan.
message NodeID {
  ulid.loki.v1.ProtoULID value = 1 [
    (gogoproto.customtype) = "github.com/grafana/loki/v3/pkg/engine/internal/proto/ulid.ULID",
    (gogoproto.nullable) = false
  ];
}

// Node represents a node in the physical plan.
message Node {
  // ID of the node.
  NodeID id = 1 [(gogoproto.nullable) = false];

  reserved 2 to 16, 19;
  reserved "aggregate_range", "aggregate_vector", "scan", "filter", "limit", "projection", "column_compat", "scan_set", "top_k", "parallelize", "join", "merge", "pointers_scan", "batching", "cache", "sort_object";

  oneof kind {
    IndexMerge index_merge = 17;
    LogMerge log_merge = 18;
    IndexFilter index_filter = 20;
  }
}

// IndexMerge represents one K-way sort-merge task over INDEX sections
// for a single tenant within one ToC window.
message IndexMerge {
  string tenant = 1;
  // Start of the metastore ToC window this task compacts, in Unix nanoseconds.
  // Pinned at plan time so the executor and pointer swap target the
  // same window regardless of clock drift between planning and execution.
  int64 toc_window_start_unix_nanos = 2;
  repeated proto.RunRef runs = 3;
}

// LogMerge represents one K-way sort-merge task over LOG sections
// for a single tenant within one ToC window.
message LogMerge {
  string tenant = 1;
  int64 toc_window_start_unix_nanos = 2;
  repeated proto.RunRef runs = 3;
  // Field 4 held the sort schema. Do not reuse it.
  reserved 4;
  reserved "sort_schema";
  // key_range limits the merge to the streams in the range. A missing
  // key_range keeps every stream.
  proto.KeyRange key_range = 5;
}

// IndexFilter copies the postings and stats rows of the listed log objects
// from one tenant's index into a new index object. It reads only the source
// index.
message IndexFilter {
  string tenant = 1;
  string source_index_path = 2;
  repeated string object_paths = 3;
}
