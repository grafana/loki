// physicalpb.proto holds types for the physical plan of a compaction task.
syntax = "proto3";

package loki.physical;

import "gogoproto/gogo.proto";
import "pkg/dataobj/compaction/v2/proto/compactionv2.proto";
import "pkg/engine/internal/proto/ulid/ulid.proto";

option go_package = "github.com/grafana/loki/v3/pkg/engine/internal/proto/physicalpb";

// Plan represents a physical plan.
message Plan {
  repeated Node nodes = 1;
  repeated PlanEdge edges = 2;
}

// PlanEdge represents a relationship between two nodes in the physical plan.
message PlanEdge {
  NodeID parent = 1 [(gogoproto.nullable) = false];
  NodeID child = 2 [(gogoproto.nullable) = false];
}

// NodeID represents a unique identifier for a node in the physical plan.
message NodeID {
  ulid.loki.v1.ProtoULID value = 1 [
    (gogoproto.customtype) = "github.com/grafana/loki/v3/pkg/engine/internal/proto/ulid.ULID",
    (gogoproto.nullable) = false
  ];
}

// Node represents a node in the physical plan.
message Node {
  // ID of the node.
  NodeID id = 1 [(gogoproto.nullable) = false];

  reserved 2 to 16, 19;
  reserved "aggregate_range", "aggregate_vector", "scan", "filter", "limit", "projection", "column_compat", "scan_set", "top_k", "parallelize", "join", "merge", "pointers_scan", "batching", "cache", "sort_object";

  oneof kind {
    IndexMerge index_merge = 17;
    LogMerge log_merge = 18;
    IndexFilter index_filter = 20;
    DeletionSweep deletion_sweep = 21;
  }
}

// IndexMerge represents one K-way sort-merge task over INDEX sections
// for a single tenant within one ToC window.
message IndexMerge {
  string tenant = 1;
  // Start of the metastore ToC window this task compacts, in Unix nanoseconds.
  // Pinned at plan time so the executor and pointer swap target the
  // same window regardless of clock drift between planning and execution.
  int64 toc_window_start_unix_nanos = 2;
  // runs holds the runs of a merge over every posting key. A merge with a
  // posting key bound holds its runs in bounded_runs instead.
  repeated proto.RunRef runs = 3;
  // start_posting_key and end_posting_key limit the merge to the postings
  // rows whose posting key is in [start, end). Each holds an encoded posting
  // key. An empty bound is open.
  bytes start_posting_key = 4;
  bytes end_posting_key = 5;
  // bounded_runs holds the runs of a merge with a posting key bound. A worker
  // that does not know the bounds then finds no runs and fails the task. It
  // does not merge every key, which would repeat the rows of the other tasks
  // of the merge.
  repeated proto.RunRef bounded_runs = 6;
  // stats_source_paths are the source index objects whose stats rows a merge
  // with a posting key bound merges. A merge without bounds merges the stats
  // rows of every source.
  repeated string stats_source_paths = 7;
}

// LogMerge represents one K-way sort-merge task over LOG sections
// for a single tenant within one ToC window.
message LogMerge {
  string tenant = 1;
  int64 toc_window_start_unix_nanos = 2;
  repeated proto.RunRef runs = 3;
  // Field 4 held the sort schema. Do not reuse it.
  reserved 4;
  reserved "sort_schema";
  // key_range limits the merge to the streams in the range. A missing
  // key_range means the full key space.
  proto.KeyRange key_range = 5;
  // input_bytes is the uncompressed size of the log records in key_range
  // across the sections of runs, from the index stats. It is 0 if the size is
  // unknown, and then the merge does not check the size of what it reads.
  int64 input_bytes = 6;
  // The merge records output_level as the size level of each output object.
  uint32 output_level = 7;
}

// IndexFilter copies the postings and stats rows of the listed log objects
// from one tenant's index into a new index object. It reads only the source
// index, which is one index object or the index objects of one index run.
message IndexFilter {
  reserved 2;
  reserved "source_index_path";

  string tenant = 1;
  repeated string object_paths = 3;
  // source_index_paths lists the paths of every index object of the source
  // index.
  repeated string source_index_paths = 4;
  // source_index_paths_in_key_order is true if source_index_paths lists the
  // index objects in posting key order, with ranges that do not overlap. The
  // worker then reads them as one sequence. A coordinator that predates the
  // field leaves it false, and the worker merges the index objects in any
  // order.
  bool source_index_paths_in_key_order = 5;
}

// DeletionSweep finds the objects of one tenant that no ToC can reach, and
// acts on the deletion candidates.
message DeletionSweep {
  string tenant = 1;
  // delete makes the sweep delete its deletion candidates. If it is false,
  // the sweep only logs them. A planner that does not know the field sends
  // false, so an older planner gets a dry run. An older worker ignores the
  // field and does a dry run.
  bool delete = 2;
}
