name: Build operator image
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      tag:
        required: true
        type: string
      registry:
        required: true
        type: string
      organization:
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Login to GAR"
        if: ${{ inputs.registry == 'us-docker.pkg.dev' }}
        uses: "grafana/shared-workflows/actions/login-to-gar@12c87e5aa323694c820c1ff3d8e47e8237e05136"
        with:
          registry: "us-docker.pkg.dev"

      - name: "fetch openshift credentials from vault"
        if: ${{ inputs.registry == 'quay.io' }}
        uses: "grafana/shared-workflows/actions/get-vault-secrets@28361cdb22223e5f1e34358c86c20908e7248760"
        with:
          repo_secrets: |
            OPENSHIFT_USER=openshift-credentials:username
            OPENSHIFT_PASS=openshift-credentials:password

      - name: Login to Quay.io
        if: ${{ inputs.registry == 'quay.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          logout: true
          username: ${{ env.OPENSHIFT_USER }}
          password: ${{ env.OPENSHIFT_PASS }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Context has to be inferred from the image name due to zizmor high warning:
          # > WARNING: may expand into attacker-controllable code
          context: ${{ inputs.image_name == 'loki-operator-bundle' && 'operator/bundle/openshift' || 'operator' }}
          file: ${{ inputs.dockerfile }}
          platforms: "linux/amd64,linux/arm64,linux/arm"
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.organization }}/${{ inputs.image_name }}:${{ inputs.tag }}
