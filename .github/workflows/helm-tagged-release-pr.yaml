name: Helm tagged release PR

on:
  workflow_dispatch:
    inputs:
      gel_version:
        description: "GEL release version to bump the chart to (e.g. v3.6.11)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tagged-release-pr:
    runs-on: ubuntu-x64
    permissions:
      contents: "read"
      id-token: "write"
      pull-requests: "write"
    env:
      RELEASE_VERSION: "${{ inputs.gel_version }}"
      BUILD_IN_CONTAINER: false
    steps:
      # Checkout the workflow ref (the branch selected at dispatch), not a fixed
      # main tip: that way a feature-branch smoke test runs the branch's script.
      # After merge, dispatch from main so Chart.yaml/values come from main.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The chart update runs before the GitHub App token so a dispatch can
      # validate the version bump even when Vault rejects the app-token JWT.
      # The token is only needed to open the pull request.
      - name: Update/regenerate files
        id: update
        run: |
          bash .github/workflows/scripts/helm-tagged-release.sh ${RELEASE_VERSION}

      - name: Generate GitHub App Token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: loki-gh-app

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          title: "chore: Release loki helm chart ${{ steps.update.outputs.new_chart_version }}"
          body: Automated PR created by [helm-tagged-release-pr.yaml](https://github.com/grafana/loki/blob/main/.github/workflows/helm-tagged-release-pr.yaml)
          commit-message: Update loki chart to ${{ steps.update.outputs.new_chart_version }}
          branch: helm-chart-tagged-${{ steps.update.outputs.new_chart_version }}
          base: main
          labels: helm
