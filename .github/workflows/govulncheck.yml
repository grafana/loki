# govulncheck workflow.
#
# Runs `govulncheck ./...` against the root Loki Go module whenever a PR
# touches Go source or module files.

name: govulncheck

on:
  pull_request:
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: "v1.3.0"
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-x64
    # Tight cap: govulncheck queries vuln.go.dev; don't let an external
    # service stall the job for the GitHub default of 6 hours.
    timeout-minutes: 5
    permissions:
      contents: read # Needed so we can clone this repository.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Go version
        id: go-version
        run: echo "version=$(make -s goversion)" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Run govulncheck
        # Symbol-aware reachability so the large vendored tree doesn't
        # drown the signal; we only get fired for vulns actually reachable
        # from a main package.
        run: govulncheck -mode=source -show=verbose ./...
