services:
  consul:
    logging: &logging
      driver: loki-compose
      options:
        loki-url: "http://localhost:8001/loki/api/v1/push"
        loki-retries: "1"
        loki-tenant-id: "1"
    image: hashicorp/consul
    command: [ "agent", "-dev" ,"-client=0.0.0.0", "-log-level=info" ]
    ports:
      - 8500:8500

  silo:
    logging:
      <<: *logging
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    entrypoint: sh
    command: -c 'mkdir -p /data/loki /data/automq-data /data/automq-ops /data/mimir-blocks /data/mimir-ruler /data/mimir-alertmanager && exec /usr/bin/silo server --console-address :9001 /data'
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - .data-minio:/data:delegated
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10

  automq:
    logging:
      <<: *logging
    image: automqinc/automq:1.6.0
    hostname: automq
    stop_grace_period: 1m
    depends_on:
      silo:
        condition: service_healthy
    environment:
      - KAFKA_S3_ACCESS_KEY=loki
      - KAFKA_S3_SECRET_KEY=supersecret
      - KAFKA_HEAP_OPTS=-Xms1g -Xmx2g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=1G
      - CLUSTER_ID=GPULNX8cRyK1QmEYusk0vQ
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=$$CLUSTER_ID \
        --override node.id=0 \
        --override controller.quorum.voters=0@automq:9093 \
        --override controller.quorum.bootstrap.servers=automq:9093 \
        --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT \
        --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9192 \
        --override advertised.listeners=PLAINTEXT://automq:9092,HOST://localhost:9092 \
        --override inter.broker.listener.name=PLAINTEXT \
        --override log.dirs=/data/kraft \
        --override s3.telemetry.metrics.exporter.uri='prometheus://?host=0.0.0.0&port=9090' \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://silo:9000&pathStyle=true' \
        --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://silo:9000&pathStyle=true' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://silo:9000&pathStyle=true'
    # The `HOST` listener is published on the standard Kafka port, which the
    # in-network `PLAINTEXT` listener already holds inside the container.
    ports:
      - 9092:9192
    volumes:
      - automq-kraft:/data

  # Creates the `loki` topic up front so the partition count is deterministic
  # rather than whatever the broker's num.partitions happens to be.
  kafka-init:
    logging:
      <<: *logging
    image: automqinc/automq:1.6.0
    depends_on:
      - automq
    restart: on-failure
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        until /opt/automq/kafka/bin/kafka-topics.sh --bootstrap-server automq:9092 --list > /dev/null 2>&1; do
          echo 'waiting for automq to accept connections...'
          sleep 2
        done
        /opt/automq/kafka/bin/kafka-topics.sh --bootstrap-server automq:9092 \
          --create --if-not-exists --topic loki --partitions 4 --replication-factor 1
        /opt/automq/kafka/bin/kafka-topics.sh --bootstrap-server automq:9092 --describe --topic loki

  kafka-ui:
    logging:
      <<: *logging
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - automq
    environment:
      KAFKA_CLUSTERS_0_NAME: automq
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: automq:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - 8080:8080

  mimir:
    logging:
      <<: *logging
    image: grafana/mimir:3.2.2
    command: [ "-config.file=/etc/mimir/mimir.yaml" ]
    depends_on:
      silo:
        condition: service_healthy
    ports:
      - 9009:9009
    volumes:
      - ./config/mimir.yaml:/etc/mimir/mimir.yaml
      - .data-mimir:/data:delegated

  alloy:
    logging:
      <<: *logging
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - mimir
      - automq
    ports:
      - 12345:12345
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy
      - alloy-data:/var/lib/alloy/data

  memcached:
    logging:
      <<: *logging
    image: memcached:1.6.45-alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf

  jaeger:
    logging:
      <<: *logging
    #  Use 1.62 specifically since 1.63 removes the agent which we depend on for now.
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    ports:
      - 16686:16686
      - "14268"

  distributor:
    logging:
      <<: *logging
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18001 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=distributor -server.http-listen-port=8001 -server.grpc-listen-port=9001"]
    depends_on:
      consul:
        condition: service_started
      ingester-1:
        condition: service_started
      ingester-2:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8001:8001
      - 18001:18001
    volumes:
      - ./config:/loki/config

  ingester-1:
    logging:
      <<: *logging
    # The partition this ingester consumes is taken from the number on the end
    # of its instance ID, which defaults to the hostname. Compose would
    # otherwise leave that as the container ID, which has no partition in it.
    hostname: ingester-1
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18002 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=ingester -server.http-listen-port=8002 -server.grpc-listen-port=9002"]
    depends_on:
      consul:
        condition: service_started
      silo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8002:8002
      - 18002:18002
    volumes:
      - ./config:/loki/config
      - .data-ingester-1:/data:delegated

  ingester-2:
    logging:
      <<: *logging
    # The partition this ingester consumes is taken from the number on the end
    # of its instance ID, which defaults to the hostname. Compose would
    # otherwise leave that as the container ID, which has no partition in it.
    hostname: ingester-2
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18003 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=ingester -server.http-listen-port=8003 -server.grpc-listen-port=9003"]
    depends_on:
      consul:
        condition: service_started
      silo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8003:8003
      - 18003:18003
    volumes:
      - ./config:/loki/config
      - .data-ingester-2:/data:delegated

  querier:
    logging:
      <<: *logging
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18004 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=querier -server.http-listen-port=8004 -server.grpc-listen-port=9004 -querier.scheduler-address=query-scheduler:9009"]
    depends_on:
      - consul
      - silo
      - query-frontend
      - query-scheduler
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8004:8004
      - 18004:18004
    volumes:
      - ./config:/loki/config
      - .data-querier:/data:delegated

  index-gateway:
    logging:
      <<: *logging
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18008 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=index-gateway -server.http-listen-port=8008 -server.grpc-listen-port=9008"]
    depends_on:
      - consul
      - silo
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8008:8008
      - 18008:18008
    volumes:
      - ./config:/loki/config

  compactor:
    logging:
      <<: *logging
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18006 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=compactor -server.http-listen-port=8006 -server.grpc-listen-port=9006"]
    depends_on:
      - consul
      - silo
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8006:8006
      - 18006:18006
    volumes:
      - ./config:/loki/config
      - .data-compactor:/data:delegated

  query-frontend:
    logging:
      <<: *logging
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18007 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=query-frontend -server.http-listen-port=8007 -server.grpc-listen-port=9007 -frontend.scheduler-address=query-scheduler:9009 -log.level=debug"]
    depends_on:
      - consul
      - silo
      - query-scheduler
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8007:8007
      - 18007:18007
    volumes:
      - ./config:/loki/config

  query-scheduler:
    logging:
      <<: *logging
    build:
      context:    .
      dockerfile: dev.dockerfile
    image: loki
    command: ["sh", "-c", "sleep 3 && exec ./dlv exec ./loki --listen=:18009 --headless=true --api-version=2 --accept-multiclient --continue -- -config.file=./config/loki.yaml -target=query-scheduler -server.http-listen-port=8009 -server.grpc-listen-port=9009 -log.level=debug"]
    depends_on:
      - consul
      - silo
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - 8009:8009
      - 18009:18009
    volumes:
      - ./config:/loki/config

  grafana:
    logging:
      <<: *logging
    image: grafana/grafana
    depends_on:
      - query-frontend
      - querier
      - mimir
    environment:
      - GF_PATHS_PROVISIONING=/etc/config/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - 3000:3000
    volumes:
      - ./config/datasource.yaml:/etc/config/grafana/provisioning/datasources/ds.yaml
      - ./config/grafana-dashboards.yaml:/etc/config/grafana/provisioning/dashboards/dashboards.yaml
      - ./config/dashboards:/var/lib/grafana/dashboards

  log-gen:
    logging:
      <<: *logging
    image: mingrammer/flog
    command: ["-f", "json", "-l", "-d", "2s"]
    depends_on:
      - distributor

  log-gen-2:
    logging:
      driver: loki-compose
      options:
        loki-url: "http://localhost:8001/loki/api/v1/push"
        loki-retries: "1"
        loki-tenant-id: "2"
    image: mingrammer/flog
    command: ["-f", "json", "-l", "-d", "2s"]
    depends_on:
      - distributor

volumes:
  automq-kraft:
  alloy-data:
