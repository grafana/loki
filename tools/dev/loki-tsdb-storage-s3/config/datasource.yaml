apiVersion: 1
datasources:
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686 
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Loki
    type: loki
    access: proxy
    url: http://query-frontend:8007
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: '1'
  - name: Loki-Limited
    type: loki
    access: proxy
    url: http://query-frontend:8007
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
      httpHeaderName2: 'X-Loki-Query-Limits'
    secureJsonData:
      httpHeaderValue1: '1'
      httpHeaderValue2: '{"maxQueryLength":"30m"}'
