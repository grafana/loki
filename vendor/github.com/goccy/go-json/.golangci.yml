version: "2"

run:
  tests: false

linters:
  default: all
  disable:
    - containedctx
    - cyclop
    - depguard
    - dogsled
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errorlint
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomodguard
    - gosec
    - govet
    - inamedparam
    - ireturn
    - lll
    - makezero
    - mnd
    - modernize
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - noinlineerr
    - paralleltest
    - perfsprint
    - revive
    - testpackage
    - thelper
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    govet:
      enable-all: true
      disable:
        - shadow
    staticcheck:
      checks:
        - all
        # quickfix suggestions are not defects
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # not needed
      - linters:
          - staticcheck
        text: "ST1003: should not use underscores in package names"
      - linters:
          - staticcheck
        path: rtype.go
      - linters:
          - staticcheck
        path: error.go
    paths:
      - encode_optype.go

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - encode_optype.go

issues:
  # Maximum issues count per one linter. Set to 0 to disable. Default is 50.
  max-issues-per-linter: 0

  # Maximum count of issues with the same text. Set to 0 to disable. Default is 3.
  max-same-issues: 0
