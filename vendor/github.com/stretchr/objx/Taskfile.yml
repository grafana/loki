version: '3'

tasks:
  default:
    deps: [test]

  generate:
    desc: Regenerates type_specific_codegen*.go from codegen/
    cmds:
      - go generate ./...

  lint:
    desc: Runs golangci-lint
    cmds:
      - golangci-lint run ./...

  lint-fix:
    desc: Runs golangci-lint and applies fixes
    cmds:
      - golangci-lint run --fix ./...

  test:
    desc: Runs go tests
    cmds:
      - go test -race  ./...

  test-coverage:
    desc: Runs go tests and calculates test coverage
    cmds:
      - go test -race -coverprofile=c.out ./...
